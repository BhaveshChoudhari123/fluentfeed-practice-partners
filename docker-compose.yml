services:
  mongodb:
    image: mongo:7
    container_name: fluentfeed-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fluentfeed_mongo_data:/data/db

  backend:
    build: ./backend
    container_name: fluentfeed-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/fluentfeed
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: fluentfeed-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  fluentfeed_mongo_data:
